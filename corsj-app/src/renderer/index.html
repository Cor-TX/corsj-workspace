<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>corsj — 通用工程设计系统</title>
  <style>
    :root {
      --bg: #10141a; --panel: #171d26; --panel2: #1d2430; --line: #2a3342;
      --text: #dce3ec; --dim: #8a97a8; --accent: #4da3ff; --ok: #4cc38a; --err: #e5646c; --warn: #e0a24c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font: 13px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
    header .logo { font-weight: 700; color: var(--accent); letter-spacing: 1px; }
    header .meta { color: var(--dim); font-size: 12px; }
    header .spacer { flex: 1; }
    header button { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 14px; cursor: pointer; }
    header button:hover { border-color: var(--accent); color: var(--accent); }
    main { flex: 1; display: grid; grid-template-columns: 300px 1fr 380px; min-height: 0; }
    #region-a { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
    #region-a h2, #region-c h2 { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; padding: 10px 14px 6px; }
    #goal { flex: 0 0 auto; margin: 0 12px 10px; height: 150px; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 10px; resize: vertical; font: inherit; }
    #thinking { flex: 1; overflow: auto; padding: 0 12px 12px; }
    .think-item { padding: 6px 8px; border-left: 3px solid var(--line); margin-bottom: 6px; }
    .think-item .t { color: var(--accent); font-size: 12px; }
    .think-item .d { color: var(--dim); font-size: 11px; }
    #cmdlist { flex: 0 0 auto; max-height: 200px; overflow: auto; padding: 0 12px 12px; border-top: 1px solid var(--line); }
    .cmd { padding: 4px 8px; border-bottom: 1px solid var(--line); }
    .cmd .id { color: var(--accent); font-family: Consolas, monospace; font-size: 11px; }
    .cmd .lvl { float: right; color: var(--dim); font-size: 10px; }
    #region-b { display: flex; flex-direction: column; min-height: 0; }
    #b-toolbar { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    #b-toolbar button { background: var(--accent); color: #06121f; font-weight: 600; border: 0; border-radius: 6px; padding: 8px 18px; cursor: pointer; }
    #b-toolbar button.sec { background: var(--panel2); color: var(--text); border: 1px solid var(--line); }
    #b-toolbar button:disabled { opacity: .5; cursor: wait; }
    #run-state { color: var(--dim); }
    #region-b .body { flex: 1; display: flex; min-height: 0; }
    #timeline { flex: 1; overflow: auto; padding: 14px 16px; border-right: 1px solid var(--line); }
    .phase { margin-bottom: 10px; border-left: 3px solid var(--line); padding-left: 12px; }
    .phase.ok { border-left-color: var(--ok); }
    .phase.err { border-left-color: var(--err); }
    .phase.warn { border-left-color: var(--warn); }
    .phase .ph-title { font-weight: 600; }
    .phase .ph-detail { color: var(--dim); font-size: 12px; white-space: pre-wrap; }
    .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; margin-left: 8px; }
    .badge.ok { background: #123527; color: var(--ok); }
    .badge.err { background: #3a171b; color: var(--err); }
    .badge.warn { background: #3a2a12; color: var(--warn); }
    #artifacts { width: 300px; overflow: auto; padding: 12px; background: var(--panel); }
    #artifacts h3 { font-size: 12px; color: var(--dim); margin-bottom: 8px; }
    .art { font-family: Consolas, monospace; font-size: 11px; padding: 3px 0; color: var(--text); }
    #guiframe { width: 100%; height: 100%; border: 0; background: var(--panel2); }
    #region-c { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
    #progress-wrap { margin: 0 12px 10px; }
    #progress-bar { height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; }
    #progress-fill { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
    #progress-text { color: var(--dim); font-size: 11px; margin-top: 4px; }
    #gate-verdict { margin: 0 12px 10px; padding: 12px; border-radius: 8px; background: var(--panel2); }
    #gate-verdict .g-decision { font-size: 15px; font-weight: 700; }
    #gate-verdict .g-detail { color: var(--dim); font-size: 12px; margin-top: 4px; white-space: pre-wrap; }
    #export-row { margin: 0 12px 10px; display: flex; gap: 6px; align-items: center; }
    #export-row input, #export-row select { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font: inherit; }
    #export-row button { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
    #degradation { margin: 0 12px 10px; }
    .deg { padding: 4px 0; border-bottom: 1px solid var(--line); font-size: 11px; }
    .deg .oid { color: var(--warn); font-family: Consolas, monospace; }
    .dim { color: var(--dim); }
    #objtree { flex: 1; overflow: auto; padding: 0 12px 12px; font-size: 12px; }
    details { margin: 2px 0; }
    summary { cursor: pointer; color: var(--text); }
    summary .oid { color: var(--accent); font-family: Consolas, monospace; }
    .payload { color: var(--dim); padding-left: 18px; font-family: Consolas, monospace; font-size: 11px; }
  </style>
</head>
<body>
  <header>
    <span class="logo">corsj</span>
    <span class="meta" id="sys-meta">初始化…</span>
    <span class="spacer"></span>
    <button id="btn-config">模型供应商…</button>
  </header>
  <main>
    <section id="region-a" aria-label="A 区：设计输入与思考流">
      <h2>A 区 · 设计目标</h2>
      <textarea id="goal" placeholder="输入设计目标，例如：&#10;设计一个电子设备结构支架：外形为 100×50×20mm 的长方体零件，材料 7075 铝，承受顶面 1.5MPa 压力，许用应力不超过 200 MPa。电路板原理图必须通过 ERC 检查且零错误。整机功耗 12W，配 33Wh 电池，能量闭合仿真相对误差不超过 1%。"></textarea>
      <h2>AI 思考过程流</h2>
      <div id="thinking"><span class="dim">尚未运行</span></div>
      <h2>命令面板</h2>
      <div id="cmdlist">加载中…</div>
    </section>
    <section id="region-b" aria-label="B 区：实时画面与闭环">
      <div id="b-toolbar">
        <button id="btn-run">运行七步闭环</button>
        <button id="btn-import" class="sec">导入 .eop</button>
        <span id="run-state">就绪</span>
      </div>
      <div class="body">
        <div id="timeline"></div>
        <div id="artifacts">
          <h3>产物 / GUI 区</h3>
          <div id="art-list"><span class="dim">运行后显示 artifacts 流</span></div>
          <iframe id="guiframe" title="GUI 工具区" sandbox="allow-scripts"></iframe>
        </div>
      </div>
    </section>
    <section id="region-c" aria-label="C 区：进度与门禁">
      <h2>C 区 · 进度与门禁</h2>
      <div id="progress-wrap">
        <div id="progress-bar"><div id="progress-fill"></div></div>
        <div id="progress-text">就绪</div>
      </div>
      <div id="gate-verdict"><div class="g-decision">—</div><div class="g-detail">尚未运行</div></div>
      <h2>标准格式导出</h2>
      <div id="export-row">
        <input id="export-object" placeholder="对象 id" value="Bracket" />
        <select id="export-format"><option>json</option><option>csv</option><option>md</option><option>step</option><option>stl</option></select>
        <button id="btn-export">导出</button>
      </div>
      <h2>降级项</h2>
      <div id="degradation"><span class="dim">无</span></div>
      <h2>.eop 对象树</h2>
      <div id="objtree"><span class="dim">尚未生成</span></div>
    </section>
  </main>
  <script src="./renderer.js"></script>
</body>
</html>
